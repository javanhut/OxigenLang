[package]
name = "oxigen-site"
version = "0.1.4"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Builds oxigenlang.com from docs/ and website/"
publish = false

[[bin]]
name = "oxigen-site"
path = "src/main.rs"

[dependencies]
oxigen-core = { path = "../../core", default-features = false }
# Checks the docs' examples through the playground's own sandboxed run, so a
# Run button only appears on code the browser can actually run.
oxigen-playground = { path = "../oxigen-playground" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde_json = "1.0.150"
toml = "1.1.2"
# Reads the latest GitHub release for the download page (see src/release.rs).
ureq = "3"
