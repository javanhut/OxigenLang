[package]
name = "oxigen-core"
version = "0.2.2"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
# JIT on by default: the Cranelift-backed compiler is the standard backend and
# carries the VM correctness/perf work.
# Build with `--no-default-features` for a VM-interpreter-only binary that omits
# the cranelift dep tree.
default = ["jit"]
jit = [
  "dep:cranelift-jit",
  "dep:cranelift-module",
  "dep:cranelift-codegen",
  "dep:cranelift-frontend",
  "dep:cranelift-native",
]

[dependencies]
toml = "1.1.2"
regex = "1"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
base64 = "0.23"
sha2 = "0.11"
md-5 = "0.11"
sha1 = "0.11"
hex = "0.4"
urlencoding = "2"
# Diagnostics render to JSON for `oxigen check` / the LSP; the renderer lives
# here so every stage shares one implementation.
serde_json = "1.0.150"

# Not on wasm32: rustls's `ring` cannot target wasm32-unknown-unknown, so the
# browser build has no HTTP client (see `netres::NO_HTTP`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "3"
# `ffi` module: calls C with any signature (variadics, structs, callbacks).
libffi = "5.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

cranelift-jit = { version = "0.134", optional = true }
cranelift-module = { version = "0.134", optional = true }
cranelift-codegen = { version = "0.134", optional = true }
cranelift-frontend = { version = "0.134", optional = true }
cranelift-native = { version = "0.134", optional = true }
