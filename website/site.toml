[[section]]
title = "Embedding and internals"
pages = [
    { file = "embedding.md", slug = "embedding", title = "Embedding in Rust", description = "Embed OxigenLang in a Rust program such as a game engine: native functions, host values, capability sandboxing, loop budgets and hot reload." },
    { file = "FFI_ARCHITECTURE.md", slug = "ffi-architecture", title = "FFI architecture", description = "How OxigenLang calls C: signature parsing, value marshalling through libffi, struct layout, callbacks re-entering the VM, and the ffi capability." },
    { file = "JIT_ARCHITECTURE.md", slug = "jit-architecture", title = "JIT architecture", description = "How OxigenLang's Cranelift baseline JIT works: tiering, supported opcodes, inline caches, specialized entries, safety invariants and benchmarks." },
]
