    { file = "stdlib/datetime.md", slug = "stdlib/datetime", title = "datetime", description = "The OxigenLang datetime module: UTC calendar dates and times, formatting and parsing." },
    { file = "stdlib/random.md", slug = "stdlib/random", title = "random", description = "The OxigenLang random module: random integers, floats, booleans and picks from an array." },
    { file = "stdlib/encoding.md", slug = "stdlib/encoding", title = "encoding", description = "The OxigenLang encoding module: Base64, hex and URL percent-encoding." },
    { file = "stdlib/hash.md", slug = "stdlib/hash", title = "hash", description = "The OxigenLang hash module: SHA-256, SHA-1 and MD5 digests as lowercase hex." },
    { file = "stdlib/ansi.md", slug = "stdlib/ansi", title = "ansi", description = "The OxigenLang ansi module: terminal colours, text styles and cursor control." },
