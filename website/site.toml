    { file = "stdlib/strings.md", slug = "stdlib/strings", title = "strings", description = "The OxigenLang strings module: splitting, joining, trimming, case conversion, searching and padding." },
    { file = "stdlib/array.md", slug = "stdlib/array", title = "array", description = "The OxigenLang array module: map, filter, reduce, folds, searching, grouping and sorting." },
    { file = "stdlib/sets.md", slug = "stdlib/sets", title = "sets", description = "The OxigenLang sets module: union, intersection, difference, subset tests and filtering." },
