# The oxigenlang.org website: what `imlazy site` builds into target/site.
# The documentation pages are rendered from docs/*.md, so the site and the
# repository never disagree; this file only says how they are arranged.

# The canonical address. oxigenlang.org and oxigenlang.com redirect here, so
# search engines see one site rather than copies competing with each other.
url = "https://www.oxigenlang.org"
name = "OxigenLang"
description = "OxigenLang is a modern general-purpose programming language created by Javan Hutchinson: a Rust-built bytecode VM with a Cranelift JIT, pattern matching, enums, structs, a two-tier error model, share-nothing concurrency, C interop and a 25-module standard library."
repo = "https://github.com/javanhut/OxigenLang"
branch = "main"

[author]
name = "Javan Hutchinson"
url = "https://github.com/javanhut"
# A photo of you for the home and about pages and for search engines, such as
# "/javan.jpg" for website/static/javan.jpg. Without one the pages show a
# monogram.
photo = ""
# Profiles that are the same person, for search engines' knowledge graphs
# (schema.org `sameAs`). Add LinkedIn, X, a personal site...
same_as = ["https://github.com/javanhut"]

# The docs sidebar, in order. `file` is relative to docs/; `slug` becomes
# /docs/<slug>/. `title` overrides the page's first heading in the sidebar,
# and `description` its meta description (otherwise its first paragraph).
[[section]]
title = "Start here"
pages = [
    { file = "getting_started.md", slug = "getting-started", title = "Getting started", description = "Install OxigenLang, run your first program, and learn the oxigen command: the REPL, fmt, check, test and explain." },
    { file = "syntax.md", slug = "syntax", title = "Syntax quick reference", description = "All of OxigenLang's syntax on one page: variables, types, functions, control flow, structs, enums, patterns, errors and imports." },
    { file = "conventions.md", slug = "conventions", title = "Conventions", description = "How idiomatic Oxigen reads: explicit types, implicit returns, one construct per job, and naming and layout rules." },
]

[[section]]
title = "Language guide"
pages = [
    { file = "variables.md", slug = "variables", title = "Variables", description = "The four ways to declare a variable in OxigenLang, and what each says about mutability and type." },
    { file = "data_types.md", slug = "data-types", title = "Data types", description = "Integers, floats, strings, chars, booleans, arrays, tuples, maps, sets, bytes and None in OxigenLang." },
    { file = "operators.md", slug = "operators", title = "Operators", description = "Arithmetic, comparison, logical and postfix operators in OxigenLang, and the order they bind in." },
    { file = "control_flow.md", slug = "control-flow", title = "Control flow", description = "Decisions with option and unless, guards with when, and loops with each and repeat in OxigenLang." },
    { file = "functions.md", slug = "functions", title = "Functions", description = "Named and anonymous functions in OxigenLang: typed, default, optional and named parameters, closures and recursion." },
    { file = "structs.md", slug = "structs", title = "Structs", description = "Structs in OxigenLang: typed fields, methods with includes, inheritance, hidden fields and self." },
    { file = "enums.md", slug = "enums", title = "Enums", description = "Enums in OxigenLang: unit, tuple and struct variants, discriminants, and matching on them." },
    { file = "pattern_matching.md", slug = "pattern-matching", title = "Pattern matching", description = "Name a condition once with pattern, then dispatch on it with choose. Pattern matching in OxigenLang." },
    { file = "type_system.md", slug = "type-system", title = "Type system", description = "OxigenLang is dynamic by default. Add an annotation and a variable's type is locked and checked by the VM." },
    { file = "angle_forms.md", slug = "angle-forms", title = "Angle forms and errors", description = "OxigenLang's <...> forms: type annotations, casts, Error and Value results, <guard>, <log>, <fail> and <test>." },
    { file = "imports.md", slug = "imports", title = "Imports and modules", description = "Import the standard library or your own files with introduce: namespaces, selective imports and module caching." },
    { file = "concurrency.md", slug = "concurrency", title = "Concurrency", description = "Run work on every core with diverge and converge. Share-nothing tasks on real OS threads, with no locks." },
    { file = "testing.md", slug = "testing", title = "Testing", description = "Write <test> blocks with expect() matchers next to your code and run them with oxigen test." },
    { file = "builtins.md", slug = "builtins", title = "Built-in functions", description = "Every built-in OxigenLang function, from print and len to range, type and the collection helpers." },
]

