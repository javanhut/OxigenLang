    { file = "stdlib/test.md", slug = "stdlib/test", title = "test", description = "The OxigenLang test module: the expect() assertion matchers behind oxigen test." },
    { file = "stdlib/channel.md", slug = "stdlib/channel", title = "channel", description = "The OxigenLang channel module: pass messages between diverge tasks in order, with timeouts and closing." },
