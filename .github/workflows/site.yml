name: Website

# Builds oxigenlang.com and deploys it to GitHub Pages. Pull requests build it
# too, without deploying: a docs example the playground can no longer run, a
# showcase example that fails, or a change that breaks the WebAssembly build
# fails here before it reaches the site. The steps are `imlazy site`'s, spelled
# out because the runner has no imlazy.

on:
  push:
    branches: [main]
  pull_request:
  # release.yml dispatches this on main after publishing a release, so the
  # download page lists the new files. (A `release` trigger would run on the
  # tag, which the github-pages environment refuses to deploy.)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM: target/wasm32-unknown-unknown/wasm/oxigen_playground.wasm

jobs:
  build:
    name: Build the website
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-opt
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build the playground's WebAssembly
        run: cargo build -p oxigen-playground --target wasm32-unknown-unknown --profile wasm
      - name: Shrink it
        run: >-
          wasm-opt -O3 --enable-bulk-memory --enable-nontrapping-float-to-int
          --enable-sign-ext --enable-mutable-globals --enable-multivalue
          --enable-reference-types "$WASM" -o "${WASM%.wasm}.opt.wasm"
      # Where Pages serves the site: "/OxigenLang" at javanhut.github.io until
      # the custom domain is set, then "" at oxigenlang.com. Pull requests only
      # check the build, so they skip this and build for the root.
      - name: Find the Pages base path
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Build the site
        run: >-
          cargo run --release -p oxigen-site --
          --wasm "${WASM%.wasm}.opt.wasm"
          --base "${{ steps.pages.outputs.base_path }}"
        env:
          # Reading the latest release from the GitHub API, without its anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/site

  # https://oxigenlang.com/install.sh, run for real on every platform it
  # installs for, against the latest release.
  installer:
    name: Installer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      - name: Lint
        if: runner.os == 'Linux'
        run: shellcheck -s sh -S warning website/static/install.sh
      - name: Install, run, uninstall
        run: |
          prefix="$RUNNER_TEMP/oxigen"
          sh website/static/install.sh --prefix "$prefix"
          "$prefix/bin/oxigen" --version
          printf 'introduce math\nprintln(math.sqrt(16))\n' > "$RUNNER_TEMP/t.oxi"
          test "$("$prefix/bin/oxigen" "$RUNNER_TEMP/t.oxi")" = 4
          sh website/static/install.sh --prefix "$prefix" --uninstall
          test ! -e "$prefix/bin/oxigen"

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
