[workspace]
resolver = "3"
members = [
    "core",
    "crates/oxigen-cli",
]

[profile.release]
lto = true
codegen-units = 1
# Unwind, not abort: the test runner and the worker pool catch a panic and
# report it as a failed test or task, instead of the process dying with
# every other result lost.
panic = "unwind"

[profile.test]
# oxigen-core's test target pulls in a very large in-crate unit test surface.
# Turning off debuginfo for test builds keeps `cargo test` from ballooning
# memory during codegen/link while leaving normal dev builds unchanged.
debug = 0
